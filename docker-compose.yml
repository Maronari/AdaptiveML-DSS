services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    working_dir: /app
    volumes:
      - ./:/app
      - api_storage:/var/lib/adaptiveml/storage
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ADAPTIVEML_STORAGE_ROOT: /var/lib/adaptiveml/storage
      ADAPTIVEML_OBJECT_STORAGE_BACKEND: minio
      ADAPTIVEML_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      ADAPTIVEML_OBJECT_STORAGE_ACCESS_KEY: minioadmin
      ADAPTIVEML_OBJECT_STORAGE_SECRET_KEY: minioadmin
      ADAPTIVEML_OBJECT_STORAGE_DATASETS_BUCKET: adaptiveml-datasets
      ADAPTIVEML_OBJECT_STORAGE_ARTIFACTS_BUCKET: adaptiveml-artifacts
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: adaptiveml
      POSTGRES_USER: adaptiveml
      POSTGRES_PASSWORD: adaptiveml
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - minio_data:/data

volumes:
  api_storage:
  postgres_data:
  minio_data:
