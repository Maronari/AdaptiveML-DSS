services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    working_dir: /app
    volumes:
      - ./:/app
      - api_storage:/var/lib/adaptiveml/storage
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ADAPTIVEML_STORAGE_ROOT: /var/lib/adaptiveml/storage
      ADAPTIVEML_OBJECT_STORAGE_BACKEND: minio
      ADAPTIVEML_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      ADAPTIVEML_OBJECT_STORAGE_ACCESS_KEY: minioadmin
      ADAPTIVEML_OBJECT_STORAGE_SECRET_KEY: minioadmin
      ADAPTIVEML_OBJECT_STORAGE_DATASETS_BUCKET: adaptiveml-datasets
      ADAPTIVEML_OBJECT_STORAGE_ARTIFACTS_BUCKET: adaptiveml-artifacts
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: adaptiveml
      POSTGRES_USER: adaptiveml
      POSTGRES_PASSWORD: adaptiveml
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  api_storage:
  postgres_data:
  minio_data:
