<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoML</title>
    <link rel="stylesheet" href="./prototype/style.css?v=20260323-0210">
    <link rel="stylesheet" href="./projects.css?v=20260323-0210">
</head>
<body>
    <div class="top-bar">
        <h1>AutoML</h1>
        <div class="top-bar-actions">
            <a href="./index.html" class="btn">Проекты</a>
            <a href="./training.html" class="btn secondary">Обучение</a>
            <a href="./graph.html" class="btn secondary">График</a>
        </div>
    </div>
    <p id="projectsStatus" class="page-status">Загружаю проекты...</p>

    <div class="container" id="container"></div>

    <div id="projectsEmpty" class="empty-state" hidden>
        В реестре пока нет проектов. Создайте новый проект и перейдите к обучению.
    </div>

    <div class="modal" id="newProjectModal">
        <div class="modal-content">
            <h2>Новый проект</h2>
            <div class="form-group">
                <label for="projectName">Имя</label>
                <input type="text" id="projectName" maxlength="120" placeholder="Имя проекта, например: Электроэнергия Март">
            </div>
            <p id="projectModalStatus" class="modal-status">Укажите название проекта. Идентификатор будет создан автоматически.</p>
            <div class="modal-actions">
                <button type="button" id="cancelProjectButton" class="btn secondary">Отмена</button>
                <button type="button" id="createProjectButton" class="btn">Создать</button>
            </div>
        </div>
    </div>

    <script type="module" src="./projects.js?v=20260323-0210"></script>
</body>
</html>
