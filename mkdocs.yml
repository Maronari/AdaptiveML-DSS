site_name: Документация AdaptiveML DSS
site_description: Документация по бэкенду, ML-контуру, DSS-слою и утилитам AdaptiveML DSS.
site_url: https://maronari.github.io/AdaptiveML-DSS/
repo_name: Maronari/AdaptiveML-DSS
repo_url: https://github.com/Maronari/AdaptiveML-DSS

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js

nav:
  - Главная: index.md
  - Установка: setup.md
  - Архитектура: architecture.md
  - СППР: dss.md
  - Схема БД: database.md
  - Общая ER-диаграмма: database-single-diagram.md
  - API: api.md
  - CLI и утилиты: cli.md
  - Визуализация: visualization.md
  - Обзор реализации: implementation-overview.md
